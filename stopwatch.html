<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 타임 어택</title>
<style>
  :root {
    --bg: #f4f1f8; --card: #ffffff; --text: #1d1a22; --muted: #6e6878;
    --line: #e7e2ee; --brand: #7823dc; --brand-soft: #efe4fc;
    --stop: #e5484d; --neutral: #e4dfea; --ok: #2f9e6a; --fire: #ff6a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0c14; --card: #1b1722; --text: #f3f0f7; --muted: #a39cae;
      --line: #2c2636; --brand-soft: #2a1d3d; --neutral: #2f2938;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 460px; }
  .card { background: var(--card); border-radius: 22px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size: 15px; font-weight: 600; color: var(--brand); margin: 0 0 10px; letter-spacing: .3px; }

  /* ---------- 무대 ---------- */
  .stage { position: relative; height: 270px; display: flex; justify-content: center; overflow: hidden;
           border-radius: 18px; transition: background .4s;
           background: radial-gradient(circle at 50% 70%, var(--brand-soft), transparent 72%); }
  .stage.hot { background: radial-gradient(circle at 50% 65%, rgba(255,150,40,.45), rgba(255,70,0,.1) 55%, transparent 78%); }
  .stage svg { height: 100%; max-width: 100%; overflow: visible; }
  .speech { position: absolute; top: 12px; right: 12px; z-index: 2; max-width: 50%;
            background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            padding: 6px 11px; font-size: 12px; color: var(--muted); transition: color .2s; }
  .hot .speech { color: var(--fire); font-weight: 700; border-color: #ffc89a; }
  .fly { position: absolute; bottom: 120px; font-size: 13px; font-weight: 800; color: var(--brand);
         pointer-events: none; white-space: nowrap; animation: flyOut 1.1s ease-out forwards; z-index: 1; }
  .fly.fire { font-size: 20px; }
  .fly.spark { color: #ff9800; font-size: 15px; }
  @keyframes flyOut {
    0% { transform: translate(0, 0) scale(.5); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(var(--dx), -140px) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }

  /* ---------- 캐릭터 기본 ---------- */
  #char * { transform-box: view-box; }
  #body  { transform-origin: 150px 200px; }
  #head  { transform-origin: 150px 122px; }
  .eyes  { transform-box: fill-box !important; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
  .ahoge { transform-origin: 153px 30px; animation: sway 2.6s ease-in-out infinite; }
  .fl    { transform-box: fill-box !important; transform-origin: 50% 100%; animation: flicker .22s ease-in-out infinite alternate; }
  .fl.d1 { animation-delay: -.07s; animation-duration: .18s; }
  .fl.d2 { animation-delay: -.13s; animation-duration: .27s; }
  .steam path { animation: steam 2.6s ease-in-out infinite; opacity: 0; }
  .steam path:nth-child(2) { animation-delay: 1.3s; }

  .work-only { display: none; }
  .work .work-only { display: inline; }
  .work .idle-only { display: none; }

  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes flicker { from { transform: scale(1, 1) skewX(-5deg); } to { transform: scale(.88, 1.16) skewX(5deg); } }
  @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: .7; } 100% { transform: translateY(-12px); opacity: 0; } }

  /* 대기: 숨쉬기, 고개 갸웃, 가끔 한 손으로 톡 */
  .idle #body  { animation: breathe 3.6s ease-in-out infinite; }
  .idle #head  { animation: ponder 6s ease-in-out infinite; }
  .idle .armR  { animation: tapOnce 3.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: translateY(-2px); } }
  @keyframes ponder { 0%,100% { transform: rotate(0); } 35% { transform: rotate(-5deg); } 65% { transform: rotate(3deg); } }
  @keyframes tapOnce { 0%,80%,100% { transform: translateY(0); } 86% { transform: translateY(-6px); } 92% { transform: translateY(0); } }

  /* 작업: 불타는 광타 */
  .work #body  { animation: jitter .14s linear infinite; }
  .work #head  { animation: headBob .3s ease-in-out infinite; }
  .work .armL  { animation: type .1s ease-in-out infinite alternate; }
  .work .armR  { animation: type .1s ease-in-out infinite alternate-reverse; }
  .work .ahoge { animation: sway .14s linear infinite; }
  .work .mug   { animation: rattle .12s linear infinite; }
  .work .steam path { animation-duration: .8s; }
  .work .speed { animation: speed .15s linear infinite; }
  .work .aura  { animation: auraPulse .45s ease-in-out infinite alternate; }
  @keyframes jitter {
    0%,100% { transform: translate(0, 0); } 25% { transform: translate(1px, -2px); }
    50% { transform: translate(-1px, 0); } 75% { transform: translate(1px, -1px); }
  }
  @keyframes headBob { 0%,100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(2px); } }
  @keyframes type { from { transform: translateY(0); } to { transform: translateY(-8px); } }
  @keyframes rattle { 25% { transform: translate(1px, 0) rotate(2deg); } 75% { transform: translate(-1px, 0) rotate(-2deg); } }
  @keyframes speed { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: .2; transform: translateY(-4px); } }
  @keyframes auraPulse { from { opacity: .85; } to { opacity: 1; } }

  /* ---------- 타이머 ---------- */
  .time { font-size: clamp(48px, 16vw, 72px); font-weight: 200; text-align: center;
          font-variant-numeric: tabular-nums; margin: 18px 0 20px; }
  .buttons { display: flex; justify-content: space-between; }
  button { font: inherit; cursor: pointer; border: none; }
  .round { width: 84px; height: 84px; border-radius: 50%; font-size: 16px; font-weight: 600;
           color: #fff; background: var(--neutral); transition: transform .08s, opacity .2s; }
  .round:active { transform: scale(.95); }
  .round:disabled { opacity: .4; cursor: default; }
  #lapBtn { color: var(--text); }
  #startBtn.start { background: var(--brand); }
  #startBtn.stop { background: var(--stop); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line);
       font-variant-numeric: tabular-nums; font-size: 14px; }
  li:last-child { border-bottom: none; }
  li.best { color: var(--ok); } li.worst { color: var(--stop); }
  #laps:not(:empty) { margin-top: 18px; border-top: 1px solid var(--line); }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>

            <!-- 팔 채움 (외곽선과 같은 경로라 어깨가 몸통에 자연스럽게 붙음) -->

                <ellipse cx="170" cy="88" rx="9.5" ry="11.5" fill="url(#iris)" stroke="#1a1026" stroke-width="2"/>
                <ellipse cx="130" cy="89" rx="4.2" ry="5.5" fill="#1a0d33"/>
                <ellipse cx="170" cy="89" rx="4.2" ry="5.5" fill="#1a0d33"/>
                <circle cx="126.5" cy="83.5" r="3.6" fill="#fff"/><circle cx="133.5" cy="94" r="1.7" fill="#fff"/>
                <circle cx="166.5" cy="83.5" r="3.6" fill="#fff"/><circle cx="173.5" cy="94" r="1.7" fill="#fff"/>
              </g>
              <g class="work-only">
                <ellipse cx="130" cy="88" rx="10" ry="11.5" fill="#fff" stroke="#1a1026" stroke-width="2"/>
                <ellipse cx="170" cy="88" rx="10" ry="11.5" fill="#fff" stroke="#1a1026" stroke-width="2"/>

<script>
  const $ = id => document.getElementById(id);
  const display = $('display'), startBtn = $('startBtn'), lapBtn = $('lapBtn'), lapList = $('laps');
  const charEl = $('char'), stage = $('stage'), speech = $('speech');

  let running = false, startTime = 0, elapsed = 0, lapStart = 0, laps = [], raf = null;
  let flyTimer = null, talkTimer = null;
  const cheers = ['불타오른다!!! 🔥', '타다다다다닥!!!', '가설 검증 가자!', '이슈 트리 쭉쭉!', 'So what? 바로 정리!',
                  '슬라이드 한 장 더!', 'MECE하게 갑니다 🔥', '엑셀 모델 풀가동!', 'Ctrl+S 연타!'];
  const keys = ['1', '0', '%', 'Σ', '▲', '$', '⌘', 'ROI', 'MECE', '#', 'Ctrl+S', 'Δ', 'CAGR', '=SUM('];
  const pick = a => a[Math.floor(Math.random() * a.length)];

  const fmt = ms => {
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
    const s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
    const p = n => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + p(m) + ':' + p(s) + '.' + p(cs);
  };
  const now = () => running ? elapsed + performance.now() - startTime : elapsed;

  function setMood() {
    clearInterval(flyTimer); clearInterval(talkTimer);
    charEl.setAttribute('class', running ? 'work' : 'idle');
    stage.classList.toggle('hot', running);
    if (running) {
      flyTimer = setInterval(spawnFly, 140);
      talkTimer = setInterval(() => { speech.textContent = pick(cheers); }, 3000);
      speech.textContent = cheers[0];
    } else {
      speech.textContent = elapsed > 0 ? '잠깐 숨 고르는 중… ☕' : '커피 한 잔 하며 대기 중 ☕';
    }
  }
  function spawnFly() {
    const n = document.createElement('span');
    const r = Math.random();
    if (r < .35) { n.className = 'fly fire'; n.textContent = '🔥'; }
    else if (r < .55) { n.className = 'fly spark'; n.textContent = pick(['✦', '✧', '⚡', '★']); }
    else { n.className = 'fly'; n.textContent = pick(keys); }
    const side = Math.random() < .5 ? -1 : 1;   // 얼굴을 가리지 않게 양옆으로 튀어나감
    n.style.left = (side < 0 ? 28 + Math.random() * 10 : 62 + Math.random() * 10) + '%';
    n.style.setProperty('--dx', side * (50 + Math.random() * 70) + 'px');
    n.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
    stage.appendChild(n);
    setTimeout(() => n.remove(), 1100);
  }

  function tick() {
    const t = now();
    display.textContent = fmt(t);
    const cur = lapList.querySelector('li.current span:last-child');
    if (cur) cur.textContent = fmt(t - lapStart);
    raf = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapList.innerHTML = '';
    if (!laps.length) return;
    const li = document.createElement('li');
    li.className = 'current';
    li.innerHTML = `<span>랩 ${laps.length + 1}</span><span>${fmt(now() - lapStart)}</span>`;
    lapList.appendChild(li);
    const min = Math.min(...laps), max = Math.max(...laps);
    for (let i = laps.length - 1; i >= 0; i--) {
      const row = document.createElement('li');
      if (laps.length > 1 && laps[i] === min) row.className = 'best';
      else if (laps.length > 1 && laps[i] === max) row.className = 'worst';
      row.innerHTML = `<span>랩 ${i + 1}</span><span>${fmt(laps[i])}</span>`;
      lapList.appendChild(row);
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(raf);
      display.textContent = fmt(elapsed);
      startBtn.textContent = '시작'; startBtn.className = 'round start';
      lapBtn.textContent = '재설정';
    } else {
      startTime = performance.now();
      running = true;
      startBtn.textContent = '정지'; startBtn.className = 'round stop';
      lapBtn.textContent = '랩'; lapBtn.disabled = false;
      tick();
    }
    setMood();
  }

  function lapOrReset() {
    if (running) {
      const t = now();
      laps.push(t - lapStart); lapStart = t;
      renderLaps();
      return;
    }
    elapsed = 0; lapStart = 0; laps = [];
    display.textContent = fmt(0);
    lapBtn.textContent = '랩'; lapBtn.disabled = true;
    renderLaps(); setMood();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running && !lapBtn.disabled) lapOrReset(); }
  });
</script>
</body>
</html>
